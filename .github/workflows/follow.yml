# Follows the original, router-for-me/pi-cliproxyapi-provider (docs/FOLLOWING.md, 2).
#
# Every 3 hours, or by hand: takes the original's newest release (npm's latest, the commit on its main that set that
# version, and npm's tarball of it, file by file the same) once it has been public for 24 hours, merges it into main,
# stamps the version and the changelog, runs the guard, then npm ci and npm run check on the merged tree. A clean,
# passing candidate is checked again, pushed to main (fast-forward only) and publish.yml is started. Anything else
# lands nothing and is said in an issue, once per state.
#
# DRY RUN. Until the owner's one-time npm steps are done (docs/FOLLOWING.md 4.4), "land" only says what it would do:
# it pushes nothing and starts nothing. Scheduled runs take the default below; a run by hand can choose. To switch
# it on, change 'yes' to 'no' in both places marked "the switch" (and the same in publish.yml), in one commit.
#
# Trust (docs/FOLLOWING.md 6.1): every job runs on GitHub only, from refs/heads/main only (checked exactly, by the
# shell, before anything else), checks out this run's own commit and runs its own .github/follow scripts. The jobs
# that can write (land, report) are in the environment main-only, which GitHub admits from the branch main alone
# (6.3). Only the two test jobs run the original's or the candidate's code, and they run it in a container that has
# none of the runner's credentials and sees only a tree written out by git (no .git, nothing a later step uses);
# nothing they write is read later: "land" takes the candidate from prepare's artifact by the id and digest prepare
# output, checks it again by content, and takes from the test jobs only their conclusion. No job uses a cache.
name: follow

on:
  schedule:
    - cron: '47 */3 * * *'
  workflow_dispatch:
    inputs:
      version:
        description: "A published version of the original newer than main's base (X.Y.Z); empty = npm's latest"
        required: false
        default: ''
      no_wait:
        description: 'Take it now, without the 24 hours'
        type: boolean
        default: false
      dry_run:
        description: "Dry run: land says what it would do and changes nothing"
        type: choice
        options: ['yes', 'no']
        # The switch (1 of 2).
        default: 'yes'

# One run at a time; a scheduled run waits for the one before.
concurrency:
  group: follow
  cancel-in-progress: false

permissions: {}

env:
  FOLLOW_WAIT_HOURS: '24'
  # The switch (2 of 2): what a scheduled run does.
  DRY_RUN: ${{ inputs.dry_run || 'yes' }}
  # The image the original's and the candidate's code run in.
  NODE_IMAGE: node:24.22.3-bookworm-slim@sha256:dc26ae92c9fb15cf6b1d63e20f0944b2efe0f115b20e00be48fb23fceb061c54

jobs:
  # Select, check, merge, stamp and guard: git, npm view (registry data, read as JSON), npm's tarball (read, never
  # run), jq and this run's scripts. No code of the original or of the candidate runs here.
  prepare:
    if: github.server_url == 'https://github.com'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    outputs:
      state: ${{ steps.prepare.outputs.state }}
      version: ${{ steps.prepare.outputs.version }}
      bump: ${{ steps.prepare.outputs.bump }}
      candidate: ${{ steps.prepare.outputs.candidate }}
      fork_published: ${{ steps.prepare.outputs.fork_published }}
      result: ${{ steps.prepare.outputs.result }}
      artifact_id: ${{ steps.upload.outputs.artifact-id }}
      artifact_digest: ${{ steps.upload.outputs.artifact-digest }}
    steps:
      - name: Only refs/heads/main
        run: '[ "$GITHUB_REF" = refs/heads/main ] || { echo "follow runs from refs/heads/main only"; exit 1; }'
      - name: Check the inputs
        env:
          V: ${{ inputs.version }}
        shell: bash
        run: |
          re='^(0|[1-9][0-9]{0,5})\.(0|[1-9][0-9]{0,5})\.(0|[1-9][0-9]{0,5})$'
          if [[ -n $V && ! $V =~ $re ]]; then echo "The version input is not a plain X.Y.Z."; exit 1; fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      # Both ways: with GITHUB_ACTIONS unset and set to true, side by side.
      - name: Self-test of the follow scripts and workflows (throwaway repositories)
        run: bash .github/follow/test.sh
      - name: The follow scripts, outside the tree they merge
        run: cp -R .github/follow "$RUNNER_TEMP/follow"
      - name: Select, merge, stamp, guard
        id: prepare
        env:
          FOLLOW_VERSION: ${{ inputs.version }}
          FOLLOW_NO_WAIT: ${{ inputs.no_wait && 'true' || 'false' }}
          FOLLOW_OUT: ${{ runner.temp }}/out
        run: bash "$RUNNER_TEMP/follow/follow.sh" prepare
      - name: Summary
        if: always()
        env:
          RESULT: ${{ runner.temp }}/out/result.json
        run: |
          [ -s "$RESULT" ] || exit 0
          jq -r '"### follow: \(.state) \(.version // "")", "", (.reasons[]?, .conflicts[]? | "- " + .)' "$RESULT" |
            head -n 60 | tr -cd 'A-Za-z0-9 ._:,()/#\n-' >>"$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        id: upload
        if: steps.prepare.outputs.state == 'candidate'
        with:
          name: follow-candidate
          path: ${{ runner.temp }}/out/candidate.bundle
          if-no-files-found: error
          retention-days: 7

  # The merged tree: npm ci, the packed package loaded by pi, and npm run check, in a container. Runs the original's
  # and the fork's code and their dev dependencies. The container sees the tree (no .git) and this run's own scripts,
  # read-only; neither the workspace nor anything a later step reads.
  test-candidate:
    name: test (candidate)
    needs: prepare
    if: github.server_url == 'https://github.com' && needs.prepare.outputs.state == 'candidate'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      actions: read
    steps:
      - name: Only refs/heads/main
        run: '[ "$GITHUB_REF" = refs/heads/main ] || { echo "follow runs from refs/heads/main only"; exit 1; }'
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      # Before any code of the candidate runs: prepare's artifact by its id and digest, its tree written out by git
      # (checkout-index, which no export attribute can thin out).
      - name: The candidate's tree (git only)
        env:
          GH_TOKEN: ${{ github.token }}
          ID: ${{ needs.prepare.outputs.artifact_id }}
          DIGEST: ${{ needs.prepare.outputs.artifact_digest }}
          WANT: ${{ needs.prepare.outputs.candidate }}
        run: |
          set -euo pipefail
          got=$(FOLLOW_OUT="$RUNNER_TEMP/out" bash .github/follow/follow.sh fetch-candidate "$ID" "$DIGEST")
          [ "$got" = "$WANT" ] || { echo "the artifact holds $got, prepare made $WANT"; exit 1; }
          GIT_INDEX_FILE="$RUNNER_TEMP/tree.index" git read-tree "$got"
          GIT_INDEX_FILE="$RUNNER_TEMP/tree.index" git checkout-index -a --prefix="$RUNNER_TEMP/tree/"
          cp -R .github/follow "$RUNNER_TEMP/follow"
          mkdir "$RUNNER_TEMP/pack"
      # What publication packs: the clean export, packed before anything is installed into it, into a folder of its
      # own. The loader gets this archive read-only, so the package it loads is the one npm publish builds from the
      # same commit, never one an install wrote into.
      - name: Pack the clean tree
        run: >-
          docker run --rm --cap-drop ALL --security-opt no-new-privileges --user "$(id -u):$(id -g)"
          -e HOME=/tmp -e CI=true -v "$RUNNER_TEMP/tree:/w:ro" -v "$RUNNER_TEMP/pack:/pack" -w /w "$NODE_IMAGE"
          npm pack --ignore-scripts --pack-destination /pack
      # The container gets the tree and the network, and none of the runner's variables, tokens or caches.
      - name: npm ci
        run: >-
          docker run --rm --cap-drop ALL --security-opt no-new-privileges --user "$(id -u):$(id -g)"
          -e HOME=/tmp -e CI=true -v "$RUNNER_TEMP/tree:/w" -w /w "$NODE_IMAGE" npm ci
      # The clean tree's archive, loaded by pi's own loader from a consumer folder of its own (load.mjs); the
      # installed tree gives only pi itself, through the package's peers.
      - name: The packed package loads
        run: >-
          docker run --rm --cap-drop ALL --security-opt no-new-privileges --user "$(id -u):$(id -g)"
          -e HOME=/tmp -e CI=true -v "$RUNNER_TEMP/tree:/w:ro" -v "$RUNNER_TEMP/pack:/pack:ro"
          -v "$RUNNER_TEMP/follow:/follow:ro" -w /w "$NODE_IMAGE"
          sh -c 'set -- /pack/*.tgz && [ "$#" -eq 1 ] && [ -f "$1" ] && node /follow/load.mjs "$1" /w/node_modules'
      - name: npm run check
        run: >-
          docker run --rm --cap-drop ALL --security-opt no-new-privileges --user "$(id -u):$(id -g)"
          -e HOME=/tmp -e CI=true -v "$RUNNER_TEMP/tree:/w" -w /w "$NODE_IMAGE" npm run check

  # The original's release alone, the same way. Information only: it tells whether a failure is the original's own.
  test-original:
    name: test (original)
    needs: prepare
    if: github.server_url == 'https://github.com' && needs.prepare.outputs.state == 'candidate'
    continue-on-error: true
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Only refs/heads/main
        run: '[ "$GITHUB_REF" = refs/heads/main ] || { echo "follow runs from refs/heads/main only"; exit 1; }'
      - name: The original's release (git only)
        env:
          BUMP: ${{ needs.prepare.outputs.bump }}
        run: |
          set -euo pipefail
          [[ $BUMP =~ ^[0-9a-f]{40}$ ]] || { echo "no release commit"; exit 1; }
          git init -q "$RUNNER_TEMP/o"
          cd "$RUNNER_TEMP/o"
          git fetch -q --no-tags https://github.com/router-for-me/pi-cliproxyapi-provider.git main
          GIT_INDEX_FILE="$RUNNER_TEMP/tree.index" git read-tree "$BUMP"
          GIT_INDEX_FILE="$RUNNER_TEMP/tree.index" git checkout-index -a --prefix="$RUNNER_TEMP/tree/"
      - name: npm ci
        run: >-
          docker run --rm --cap-drop ALL --security-opt no-new-privileges --user "$(id -u):$(id -g)"
          -e HOME=/tmp -e CI=true -v "$RUNNER_TEMP/tree:/w" -w /w "$NODE_IMAGE" npm ci
      - name: npm run check
        run: >-
          docker run --rm --cap-drop ALL --security-opt no-new-privileges --user "$(id -u):$(id -g)"
          -e HOME=/tmp -e CI=true -v "$RUNNER_TEMP/tree:/w" -w /w "$NODE_IMAGE" npm run check

  # Checks the candidate again by content (the guard, and npm's tarball against the merged commit), pushes it to main
  # without force and starts publish.yml; or, when main already has the release but npm lacks main's version, only
  # starts publish.yml. git, gh and this run's scripts; no code of the candidate.
  land:
    needs: [prepare, test-candidate]
    if: >-
      always() && github.server_url == 'https://github.com' && needs.prepare.result == 'success' &&
      ((needs.prepare.outputs.state == 'candidate' && needs.test-candidate.result == 'success') ||
      ((needs.prepare.outputs.state == 'up-to-date' || needs.prepare.outputs.state == 'not-newer') &&
      needs.prepare.outputs.fork_published == 'false'))
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # GitHub admits only the branch main to this environment (docs/FOLLOWING.md 6.3).
    environment: main-only
    # main is written by land, publish and tag one at a time.
    concurrency:
      group: pi-provimux-main
      cancel-in-progress: false
    permissions:
      contents: write
      actions: write
    outputs:
      landed: ${{ steps.land.outputs.landed }}
    steps:
      - name: Only refs/heads/main
        run: '[ "$GITHUB_REF" = refs/heads/main ] || { echo "land runs from refs/heads/main only"; exit 1; }'
      # The token is kept for the push: this job runs no code of the candidate.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - name: Land
        id: land
        env:
          GH_TOKEN: ${{ github.token }}
          STATE: ${{ needs.prepare.outputs.state }}
          ID: ${{ needs.prepare.outputs.artifact_id }}
          DIGEST: ${{ needs.prepare.outputs.artifact_digest }}
          WANT: ${{ needs.prepare.outputs.candidate }}
          MAIN: ${{ github.sha }}
        run: |
          set -euo pipefail
          got=''
          if [ "$STATE" = candidate ]; then
            got=$(FOLLOW_OUT="$RUNNER_TEMP/out" bash .github/follow/follow.sh fetch-candidate "$ID" "$DIGEST")
            [ "$got" = "$WANT" ] || { echo "the artifact holds $got, prepare made $WANT"; exit 1; }
          fi
          FOLLOW_OUT="$RUNNER_TEMP/out" bash .github/follow/follow.sh land "$STATE" "$MAIN" "$got"

  # Writes the owner's issue: one per release of the original, updated in place, a comment when its state changes.
  report:
    needs: [prepare, test-candidate, test-original, land]
    if: always() && github.server_url == 'https://github.com'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: main-only
    permissions:
      contents: read
      actions: read
      issues: write
    steps:
      - name: Only refs/heads/main
        run: '[ "$GITHUB_REF" = refs/heads/main ] || { echo "report runs from refs/heads/main only"; exit 1; }'
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          sparse-checkout: .github/follow
          persist-credentials: false
      - name: Report
        env:
          GH_TOKEN: ${{ github.token }}
          RESULT: ${{ needs.prepare.outputs.result }}
          FOLLOW_TEST_CANDIDATE: ${{ needs.test-candidate.result }}
          FOLLOW_LAND: ${{ needs.land.outputs.landed || needs.land.result }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          printf '%s' "$RESULT" >"$RUNNER_TEMP/result.json"
          # The test jobs' conclusions and failed steps, from the API (never from files they wrote).
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/attempts/$GITHUB_RUN_ATTEMPT/jobs?per_page=100" >"$RUNNER_TEMP/jobs.json"
          FOLLOW_TEST_ORIGINAL=$(jq -r '[.jobs[] | select(.name == "test (original)") | .conclusion // "unknown"] | first // "skipped"' "$RUNNER_TEMP/jobs.json")
          export FOLLOW_TEST_ORIGINAL
          if [ "$FOLLOW_TEST_CANDIDATE" = failure ]; then
            jq -r '.jobs[] | select(.name == "test (candidate)") | .steps[] | select(.conclusion == "failure") | .name' \
              "$RUNNER_TEMP/jobs.json" >"$RUNNER_TEMP/steps.txt"
            job=$(jq -r '[.jobs[] | select(.name == "test (candidate)") | .id] | first // ""' "$RUNNER_TEMP/jobs.json")
            if [ -n "$job" ]; then
              gh api "repos/$GITHUB_REPOSITORY/actions/jobs/$job/logs" 2>/dev/null >"$RUNNER_TEMP/joblog.txt" || true
              tail -n 80 "$RUNNER_TEMP/joblog.txt" | sed -E 's/^[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9:.]+Z //' >"$RUNNER_TEMP/log.txt"
            fi
            export FOLLOW_FAILED_STEPS="$RUNNER_TEMP/steps.txt" FOLLOW_FAILED_LOG="$RUNNER_TEMP/log.txt"
          fi
          FOLLOW_RESULT="$RUNNER_TEMP/result.json" FOLLOW_OUT="$RUNNER_TEMP/out" bash .github/follow/follow.sh report
