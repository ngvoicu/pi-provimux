# Follows the original, router-for-me/pi-cliproxyapi-provider (docs/FOLLOWING.md, 2).
#
# Every 3 hours, or by hand: takes the original's newest release (npm's latest and the commit on its main that set
# that version) once it has been public for 24 hours, merges it into main, stamps the version and the changelog,
# runs the guard, then npm ci and npm run check on the merged tree. A clean, passing candidate is pushed to main
# (fast-forward only) and publish.yml is started. Anything else lands nothing and is said in an issue, once per state.
#
# DRY RUN. Until the owner's one-time npm steps are done (docs/FOLLOWING.md 4.4), "land" only says what it would do:
# it pushes nothing and starts nothing. Scheduled runs take the default below; a run by hand can choose. To switch
# it on, change 'yes' to 'no' in both places marked "the switch" (and the same in publish.yml), in one commit.
#
# Trust (docs/FOLLOWING.md 6.1): every job checks out this run's own commit and runs its own .github/follow scripts.
# Only the two test jobs run the original's or the candidate's code; they have a read-only token, no id-token, no
# secret, and nothing they write is read later: "land" takes the candidate from prepare's artifact by the id and
# digest prepare output, and from the test jobs nothing but their conclusion. No job uses a cache.
name: follow

on:
  schedule:
    - cron: '47 */3 * * *'
  workflow_dispatch:
    inputs:
      version:
        description: "A published version of the original newer than main's base; empty = npm's latest"
        required: false
        default: ''
      no_wait:
        description: 'Take it now, without the 24 hours'
        type: boolean
        default: false
      dry_run:
        description: "Dry run: land says what it would do and changes nothing"
        type: choice
        options: ['yes', 'no']
        # The switch (1 of 2).
        default: 'yes'

# One run at a time; a scheduled run waits for the one before.
concurrency:
  group: follow
  cancel-in-progress: false

permissions: {}

env:
  FOLLOW_WAIT_HOURS: '24'
  # The switch (2 of 2): what a scheduled run does.
  DRY_RUN: ${{ inputs.dry_run || 'yes' }}

jobs:
  # Select, merge, stamp and guard: git, npm view (registry data, read as JSON), jq and this run's scripts. No code
  # of the original or of the candidate runs here.
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    outputs:
      state: ${{ steps.prepare.outputs.state }}
      version: ${{ steps.prepare.outputs.version }}
      bump: ${{ steps.prepare.outputs.bump }}
      candidate: ${{ steps.prepare.outputs.candidate }}
      fork_published: ${{ steps.prepare.outputs.fork_published }}
      result: ${{ steps.prepare.outputs.result }}
      artifact_id: ${{ steps.upload.outputs.artifact-id }}
      artifact_digest: ${{ steps.upload.outputs.artifact-digest }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: The follow scripts, outside the tree they merge
        run: cp -R .github/follow "$RUNNER_TEMP/follow"
      - name: Self-test of the follow scripts (throwaway repositories)
        run: bash "$RUNNER_TEMP/follow/test.sh"
      - name: Select, merge, stamp, guard
        id: prepare
        env:
          FOLLOW_VERSION: ${{ inputs.version }}
          FOLLOW_NO_WAIT: ${{ inputs.no_wait && 'true' || 'false' }}
          FOLLOW_OUT: ${{ runner.temp }}/out
        run: bash "$RUNNER_TEMP/follow/follow.sh" prepare
      - name: Summary
        if: always()
        env:
          RESULT: ${{ runner.temp }}/out/result.json
        run: |
          [ -s "$RESULT" ] || exit 0
          jq -r '"### follow: \(.state) \(.version // "")", "", "\(.reason // "")", "", (.reasons[]?, .conflicts[]? | "- " + .)' "$RESULT" |
            tr -d '<>`' >>"$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        id: upload
        if: steps.prepare.outputs.state == 'candidate'
        with:
          name: follow-candidate
          path: ${{ runner.temp }}/out/candidate.bundle
          if-no-files-found: error
          retention-days: 7

  # The merged tree: npm ci and npm run check. Runs the original's and the fork's code and their dev dependencies.
  test-candidate:
    name: test (candidate)
    needs: prepare
    if: needs.prepare.outputs.state == 'candidate'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      # Before any code of the candidate runs: prepare's artifact by its id and digest, its tree exported.
      - name: The candidate's tree (git only)
        env:
          GH_TOKEN: ${{ github.token }}
          ID: ${{ needs.prepare.outputs.artifact_id }}
          DIGEST: ${{ needs.prepare.outputs.artifact_digest }}
          WANT: ${{ needs.prepare.outputs.candidate }}
        run: |
          set -euo pipefail
          got=$(FOLLOW_OUT="$RUNNER_TEMP/out" bash .github/follow/follow.sh fetch-candidate "$ID" "$DIGEST")
          [ "$got" = "$WANT" ] || { echo "::error::the artifact holds $got, prepare made $WANT"; exit 1; }
          mkdir "$RUNNER_TEMP/tree"
          git archive "$got" | tar -x -C "$RUNNER_TEMP/tree"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
      - name: npm ci
        working-directory: ${{ runner.temp }}/tree
        run: npm ci
      - name: npm run check
        working-directory: ${{ runner.temp }}/tree
        run: npm run check

  # The original's release alone, the same way. Information only: it tells whether a failure is the original's own.
  test-original:
    name: test (original)
    needs: prepare
    if: needs.prepare.outputs.state == 'candidate'
    continue-on-error: true
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: The original's release (git only)
        env:
          BUMP: ${{ needs.prepare.outputs.bump }}
        run: |
          set -euo pipefail
          [[ $BUMP =~ ^[0-9a-f]{40}$ ]] || { echo "::error::no release commit"; exit 1; }
          git init -q "$RUNNER_TEMP/o"
          cd "$RUNNER_TEMP/o"
          git fetch -q --no-tags https://github.com/router-for-me/pi-cliproxyapi-provider.git main
          mkdir "$RUNNER_TEMP/tree"
          git archive "$BUMP" | tar -x -C "$RUNNER_TEMP/tree"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
      - name: npm ci
        working-directory: ${{ runner.temp }}/tree
        run: npm ci
      - name: npm run check
        working-directory: ${{ runner.temp }}/tree
        run: npm run check

  # Pushes the candidate to main without force and starts publish.yml; or, when main already has the release but npm
  # lacks main's version, only starts publish.yml. git and gh only.
  land:
    needs: [prepare, test-candidate]
    if: >-
      always() && needs.prepare.result == 'success' &&
      ((needs.prepare.outputs.state == 'candidate' && needs.test-candidate.result == 'success') ||
      ((needs.prepare.outputs.state == 'up-to-date' || needs.prepare.outputs.state == 'not-newer') &&
      needs.prepare.outputs.fork_published == 'false'))
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      actions: write
    outputs:
      landed: ${{ steps.land.outputs.landed }}
    steps:
      # The token is kept for the push: this job runs no code of the candidate.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - name: Land
        id: land
        env:
          GH_TOKEN: ${{ github.token }}
          STATE: ${{ needs.prepare.outputs.state }}
          ID: ${{ needs.prepare.outputs.artifact_id }}
          DIGEST: ${{ needs.prepare.outputs.artifact_digest }}
          WANT: ${{ needs.prepare.outputs.candidate }}
          MAIN: ${{ github.sha }}
        run: |
          set -euo pipefail
          fail() { echo "::error::$*"; exit 1; }
          say() { echo "$*" | tee -a "$GITHUB_STEP_SUMMARY"; }
          [ "$GITHUB_REF" = refs/heads/main ] || fail "follow runs on main only, not $GITHUB_REF"
          live=$(git ls-remote origin refs/heads/main | cut -f1)
          if [ "$STATE" = candidate ]; then
            got=$(FOLLOW_OUT="$RUNNER_TEMP/out" bash .github/follow/follow.sh fetch-candidate "$ID" "$DIGEST")
            [ "$got" = "$WANT" ] || fail "the artifact holds $got, prepare made $WANT"
            [ "$(git rev-parse "$got^1^1")" = "$MAIN" ] || fail "$got is not two commits on $MAIN"
            if [ "$live" != "$MAIN" ]; then
              say "main moved to $live since this run started; nothing lands, the next run starts from it."
              echo "landed=moved" >>"$GITHUB_OUTPUT"
              exit 0
            fi
            if [ "$DRY_RUN" != no ]; then
              git push --dry-run origin "$got:refs/heads/main"
              say "Dry run: would push $got to main (fast-forward from $MAIN), then run publish.yml."
              echo "landed=dry-run" >>"$GITHUB_OUTPUT"
              exit 0
            fi
            # No force: git refuses anything but a fast-forward.
            git push origin "$got:refs/heads/main"
            say "Landed: main is $got."
            echo "landed=landed" >>"$GITHUB_OUTPUT"
          else
            [ "$live" = "$MAIN" ] || { say "main moved; nothing to start."; exit 0; }
          fi
          # A push with GITHUB_TOKEN starts no workflow; workflow_dispatch is the exception.
          if [ "$DRY_RUN" != no ]; then
            say "Dry run: would run gh workflow run publish.yml --ref main -f dry_run=no."
          else
            gh workflow run publish.yml -R "$GITHUB_REPOSITORY" --ref main -f dry_run=no
            say "publish.yml started."
          fi

  # Writes the owner's issue: one per release of the original, updated in place, a comment when its state changes.
  report:
    needs: [prepare, test-candidate, test-original, land]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          sparse-checkout: .github/follow
          persist-credentials: false
      - name: Report
        env:
          GH_TOKEN: ${{ github.token }}
          RESULT: ${{ needs.prepare.outputs.result }}
          FOLLOW_TEST_CANDIDATE: ${{ needs.test-candidate.result }}
          FOLLOW_LAND: ${{ needs.land.outputs.landed || needs.land.result }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          printf '%s' "$RESULT" >"$RUNNER_TEMP/result.json"
          # The test jobs' conclusions and failed steps, from the API (never from files they wrote).
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/attempts/$GITHUB_RUN_ATTEMPT/jobs?per_page=100" >"$RUNNER_TEMP/jobs.json"
          FOLLOW_TEST_ORIGINAL=$(jq -r '[.jobs[] | select(.name == "test (original)") | .conclusion // "unknown"] | first // "skipped"' "$RUNNER_TEMP/jobs.json")
          export FOLLOW_TEST_ORIGINAL
          if [ "$FOLLOW_TEST_CANDIDATE" = failure ]; then
            jq -r '.jobs[] | select(.name == "test (candidate)") | .steps[] | select(.conclusion == "failure") | .name' \
              "$RUNNER_TEMP/jobs.json" >"$RUNNER_TEMP/steps.txt"
            job=$(jq -r '[.jobs[] | select(.name == "test (candidate)") | .id] | first // ""' "$RUNNER_TEMP/jobs.json")
            if [ -n "$job" ]; then
              gh api "repos/$GITHUB_REPOSITORY/actions/jobs/$job/logs" 2>/dev/null | tail -n 80 |
                sed -E 's/^[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9:.]+Z //' >"$RUNNER_TEMP/log.txt" || true
            fi
            export FOLLOW_FAILED_STEPS="$RUNNER_TEMP/steps.txt" FOLLOW_FAILED_LOG="$RUNNER_TEMP/log.txt"
          fi
          FOLLOW_RESULT="$RUNNER_TEMP/result.json" FOLLOW_OUT="$RUNNER_TEMP/out" bash .github/follow/follow.sh report
