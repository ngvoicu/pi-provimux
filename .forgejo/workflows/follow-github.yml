name: Follow GitHub

# Runs on the owner's Forgejo server (the NAS) only, and brings the NAS's main and v* tags up to GitHub's
# (docs/FOLLOWING.md, 5). GitHub reads .github/workflows/ only, so it never sees this file. Forgejo reads
# .forgejo/workflows/ and, while this folder exists, ignores .github/workflows/: on the NAS this is the only workflow
# (no follow, no publish). Every revision of this repository that has .github/workflows/ has this file too; the
# GitHub jobs also run only when the server is github.com.
# All or nothing. Everything is checked before anything changes, and then main and the new tags go in one atomic
# push. The NAS is a mirror of GitHub's main: a fast-forward when it can be one; when GitHub's main is not a
# descendant of the NAS's, the same push also keeps the NAS's main as refs/nas-backup/main-<UTC time>, so no commit
# is lost on the NAS, and holds only while the NAS's main is still the commit read. Tags are only added: if a v* tag
# is on GitHub differently or not at all, or the server refuses any ref, nothing changes: no merge commit, no tag
# moved. GitHub is only read.
# Other branches are not mirrored.
on:
  schedule:
    - cron: "13 * * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  follow:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # Pinned: this action gets the NAS's write credential. The same commit on data.forgejo.org and on GitHub.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: refs/heads/main
          fetch-depth: 0
      - name: Fast-forward main, add new v* tags, in one atomic push
        run: |
          set -eu
          github=${FOLLOW_MIRROR_SOURCE:-https://github.com/ngvoicu/pi-provimux.git}
          git fetch --no-tags origin "+refs/heads/main:refs/remotes/origin/main"
          # A fresh inventory of GitHub's tags every run, also in a reused workspace: the tracking namespace is
          # emptied first and the fetch prunes it, so a tag gone from GitHub is not remembered from an earlier run.
          git for-each-ref --format='delete %(refname)' refs/remotes/github-tags/ | git update-ref --stdin
          git fetch --no-tags --prune "$github" "+refs/heads/main:refs/remotes/github/main" "+refs/tags/v*:refs/remotes/github-tags/v*"
          here=$(git rev-parse --verify "refs/remotes/origin/main^{commit}")
          there=$(git rev-parse --verify "refs/remotes/github/main^{commit}")
          echo "NAS main: $here"
          echo "GitHub main: $there"
          bad=0
          backup=
          if [ "$here" != "$there" ] && ! git merge-base --is-ancestor "$here" "$there"; then
            backup="refs/nas-backup/main-$(date -u +%Y%m%dT%H%M%SZ)"
            echo "GitHub's main is not a descendant of the NAS's: the NAS's main is kept as $backup, then set to GitHub's."
          fi
          # Tags: GitHub's that the NAS lacks are added; one the NAS has differently, or GitHub lacks, stops the job.
          git ls-remote --tags --refs origin 'refs/tags/v*' >"$RUNNER_TEMP/nas-tags"
          git for-each-ref --format='%(objectname) %(refname)' 'refs/remotes/github-tags/' |
            sed 's# refs/remotes/github-tags/# refs/tags/#' >"$RUNNER_TEMP/github-tags"
          set --
          lease=
          if [ "$here" != "$there" ]; then
            set -- "$there:refs/heads/main"
            lease="--force-with-lease=refs/heads/main:$here"
          fi
          if [ -n "$backup" ]; then set -- "$@" "$here:$backup"; fi
          while read -r sha ref; do
            have=$(awk -v r="$ref" '$2 == r { print $1 }' "$RUNNER_TEMP/nas-tags")
            if [ -z "$have" ]; then
              set -- "$@" "$sha:$ref"
            elif [ "$have" != "$sha" ]; then
              echo "${ref#refs/tags/} is $have on the NAS and $sha on GitHub."
              bad=1
            fi
          done <"$RUNNER_TEMP/github-tags"
          while read -r sha ref; do
            if ! awk -v r="$ref" '$2 == r { f = 1 } END { exit !f }' "$RUNNER_TEMP/github-tags"; then
              echo "${ref#refs/tags/} is on the NAS only."
              bad=1
            fi
          done <"$RUNNER_TEMP/nas-tags"
          if [ "$bad" -ne 0 ]; then
            echo "Nothing was changed."
            exit 1
          fi
          if [ "$#" -eq 0 ]; then
            echo "main and the tags: already equal."
            exit 0
          fi
          git push --atomic ${lease:+"$lease"} origin "$@"
          echo "Pushed, all at once: $*"
